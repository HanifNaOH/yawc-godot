name: Rust Tests

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:
  workflow_call:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  rust-test:
    name: Rust tests - ${{ matrix.toolchain }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, beta, nightly]
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal

      - name: Install rustfmt
        run: rustup component add rustfmt --toolchain ${{ matrix.toolchain }}

      - name: Check formatting
        run: cargo +${{ matrix.toolchain }} fmt --all -- --check

      - name: Test on Linux
        run: cargo +${{ matrix.toolchain }} test --locked --verbose --target x86_64-unknown-linux-gnu

      - name: Check echo server example
        run: cargo +${{ matrix.toolchain }} check --locked --example bridge_echo_server --target x86_64-unknown-linux-gnu