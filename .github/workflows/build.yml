name: Build GDExtension

on:
  workflow_dispatch:
    inputs:
      version:
        description: Optional version label for this manual build (without a leading v)
        required: false
        default: ""
        type: string
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/test.yml

  build-windows-x86_64-gnu:
    name: Windows x86_64 GNU build
    needs: tests
    runs-on: windows-latest
    outputs:
      version: ${{ steps.package.outputs.version }}
    env:
      CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
    steps:
      - uses: actions/checkout@v6

      - name: Cache Cargo dependencies and build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .godot/cargo-target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust-toolchain.toml', 'Cargo.toml', 'Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install MinGW-w64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          $package = $metadata.packages | Where-Object { $_.name -eq "yawc-godot" }
          if ($null -eq $package) { throw "Could not find yawc-godot in Cargo metadata." }
          $expectedTag = "v$($package.version)"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Tag '$env:GITHUB_REF_NAME' must match Cargo.toml version '$expectedTag'."
          }

      - name: Build debug GDExtension for GUT
        run: cargo build --locked --target x86_64-pc-windows-gnu

      - name: Stage debug library in addon
        shell: pwsh
        run: |
          $bin = "addons/yawc_transport/bin"
          New-Item -ItemType Directory -Force -Path $bin | Out-Null
          Copy-Item `
            ".godot/cargo-target/x86_64-pc-windows-gnu/debug/yawc_godot.dll" `
            "$bin/yawc_godot.windows.debug.x86_64.dll" `
            -Force

      - name: Download Godot 4.7.1
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "godot-4.7.1.zip"
          $installPath = Join-Path $env:RUNNER_TEMP "godot"
          New-Item -ItemType Directory -Force -Path $installPath | Out-Null
          Invoke-WebRequest `
            -Uri "https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_win64.exe.zip" `
            -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $installPath -Force

      - name: Run GUT unit tests
        shell: pwsh
        run: |
          $godot = Join-Path $env:RUNNER_TEMP "godot\Godot_v4.7.1-stable_win64_console.exe"
          & $godot --headless --path $env:GITHUB_WORKSPACE -s addons/gut/gut_cmdln.gd
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build GDExtension
        run: cargo build --locked --release --target x86_64-pc-windows-gnu

      - name: Stage release library in addon
        shell: pwsh
        run: |
          Copy-Item `
            ".godot/cargo-target/x86_64-pc-windows-gnu/release/yawc_godot.dll" `
            "addons/yawc_transport/bin/yawc_godot.windows.release.x86_64.dll" `
            -Force

      - name: Package versioned addon
        id: package
        env:
          MANUAL_VERSION: ${{ inputs.version }}
        shell: pwsh
        run: |
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          $package = $metadata.packages | Where-Object { $_.name -eq "yawc-godot" }
          if ($null -eq $package) { throw "Could not find yawc-godot in Cargo metadata." }
          $cargoVersion = $package.version
          $version = $cargoVersion
          if ($env:GITHUB_REF_TYPE -ne "tag" -and -not [string]::IsNullOrWhiteSpace($env:MANUAL_VERSION)) {
            $version = $env:MANUAL_VERSION
          }
          if ($version -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$') {
            throw "Version '$version' is not valid SemVer. Enter it without a leading v."
          }
          $archive = "yawc-godot-v$version-windows-x86_64-gnu.zip"
          Compress-Archive -Path "addons/yawc_transport" -DestinationPath $archive -Force
          "version=$version" >> $env:GITHUB_OUTPUT
          "archive=$archive" >> $env:GITHUB_OUTPUT

      - name: Upload Windows GDExtension
        uses: actions/upload-artifact@v7
        with:
          name: yawc-godot-v${{ steps.package.outputs.version }}-windows-x86_64-gnu
          path: ${{ steps.package.outputs.archive }}

  github-release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-windows-x86_64-gnu
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          name: yawc-godot-v${{ needs.build-windows-x86_64-gnu.outputs.version }}-windows-x86_64-gnu
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/yawc-godot-v${{ needs.build-windows-x86_64-gnu.outputs.version }}-windows-x86_64-gnu.zip" \
            --verify-tag \
            --generate-notes